plugins {
    id 'java'
    id 'java-library'
}

group = 'io.aero-framework'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    api project(":aero-core")
    api project(":aero-web")
    api project(":aero-boot")
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}