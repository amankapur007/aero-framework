name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Run Gemini Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');

            if (!diff.trim()) {
              console.log("No changes detected.");
              return;
            }

            // Truncate if diff is exceptionally massive
            const trimmedDiff = diff.slice(0, 50000);

            const prompt = `You are a senior code reviewer. Review the following Git diff:
            1. Summarize the changes concisely.
            2. Flag critical bugs, race conditions, edge cases, and performance regressions.
            3. Highlight security risks or resource leaks.
            4. Keep suggestions practical with brief code snippets where helpful.

            Diff:
            \`\`\`diff
            ${trimmedDiff}
            \`\`\``;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const data = await response.json();
            const reviewComment = data.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to generate review.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### 🤖 Gemini Code Review\n\n${reviewComment}`
            });
